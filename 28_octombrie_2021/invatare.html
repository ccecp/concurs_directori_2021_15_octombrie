<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>28 octombrie 2021 – mod de învățare</title><style>html,body{margin:0;height:100%;background:#f5f7fb}#test{width:100%;height:100vh;border:0;display:block}</style></head><body><iframe id="test" src="./index.html" title="Test 28 octombrie 2021"></iframe><script>
const special={
'numărul mediu de rechizite':'Adună valorile pentru rechizite din cei 6 ani: 400+200+300+500+400+300=2.100; apoi 2.100÷6=350. Regula: media aritmetică = suma valorilor ÷ numărul valorilor.',
'la sută mai multe manuale':'Întâi însumezi manualele și caietele pe toată perioada, apoi calculezi diferența procentuală raportată la baza cerută de enunț. Capcana este să compari un singur an sau să raportezi diferența la categoria greșită.',
'regiunea Est':'Pentru Est, totalul este 60+300+640=1.000, iar Acceptabil=300. Procentul este 300/1.000×100=30%. Regula: procent = parte/întreg×100.',
'cel mai mic procent al scorurilor din categoria Slab':'Nu compara doar numărul de răspunsuri „Slab”; calculează ponderea lor în totalul fiecărei regiuni. Capcana este confundarea valorii absolute cu procentul.',
'raport al scorurilor Bun față de Slab':'Pentru fiecare regiune calculezi Bun÷Slab și compari rapoartele. Regula: când se cere raportul A față de B, calculezi A/B, nu B/A.',
'cifra de afaceri din 2002':'Din raportul cifră de afaceri:capital obții cifra de afaceri, apoi calculezi profit/cifră de afaceri×100. Descompune întotdeauna itemul în două operații când valoarea de bază nu este dată direct.',
'crescut cifra de afaceri':'Calculează cifra de afaceri pentru 1998 și 2002 din raportul dat, apoi creșterea procentuală: (nou−vechi)/vechi×100. Capcana este raportarea diferenței la valoarea finală în loc de cea inițială.',
'profitul înainte de impozitare și capital':'Calculează pentru fiecare an profit/capital și compară rezultatele. Nu te lăsa atras de cel mai mare profit absolut: itemul cere un raport.',
'rigla și echerul':'Ambele sunt instrumente de măsurare. Materialul din care sunt făcute sau faptul că sunt rechizite sunt caracteristici posibile, nu relația esențială. Regula: la asemănări caută categoria funcțională comună.',
'vacanța și recreația':'Elementul comun esențial este pauza de la activitatea de învățare. „Sunt plăcute” sau „sunt așteptate” sunt aprecieri subiective. Caută trăsătura definitorie, nu una probabilă.',
'banca și catedra':'Ambele sunt piese de mobilier ale sălii de clasă. Materialul, forma sau poziția pot varia. În itemii de asemănare, preferă categoria stabilă și definitorie.',
'diriginte : clasă':'Relația este persoană cu rol de coordonare → structura coordonată: diriginte→clasă, director→școală. La analogii păstrează atât tipul relației, cât și direcția ei.',
'pensule : pânză':'Relația este instrument → suportul pe care este utilizat: pensule→pânză, creioane→caiet. Nu alege un obiect doar pentru că aparține aceleiași categorii de rechizite.',
'geometrie : riglă':'Relația este disciplină → instrument specific utilizat: geometrie→riglă, geografie→hartă. Identifică mai întâi verbul implicit: „se folosește în”.',
'muncă-familie':'La raționament verbal nu judeca dacă afirmația pare rezonabilă în viața reală. Compar-o strict cu fragmentul: adevărat = susținut, fals = contrazis, nu se poate spune = text insuficient.',
'viru':'Separă informația explicită de presupuneri. Dacă textul nu afirmă relația exactă din enunț, nu o deduce doar pentru că pare posibilă. Aceasta este capcana principală la „Nu se poate spune”.',
'radia':'Urmărește cuvintele restrictive precum „numai”, „întotdeauna”, „toate”. O afirmație devine falsă dacă restrânge sau extinde ceea ce spune textul. Compară propoziția cu fragmentul, termen cu termen.',
'Marian':'Răspunsul constructiv este să clarifici nevoia de sprijin direct cu colegul. Regula de transfer: înainte de escaladare, caută cauza și oferă sprijin când rezultatul echipei depinde de colaborare.',
'solicitări simultan':'Când cerințele sunt contradictorii, primul pas este clarificarea și comunicarea contradicțiilor către cei afectați. Nu evita problema și nu o transfera automat altcuiva.',
'conflict cu un coleg, Dan':'Intervenția adecvată urmărește de-escaladarea și revenirea la obiectivul profesional. Regula: abordează direct conflictul, fără amenințări și fără escaladare prematură la superior.',
'i-ați promis Mariei':'Prioritizezi sarcina critică pentru care ești singura persoană calificată și comunici transparent schimbarea către colega căreia îi promiseseși ajutor. Regula: prioritate organizațională + comunicare clară.',
'Bush':'La întrebările de autor, identifică termenul-cheie al teoriei, nu varianta care doar pare managerială. Pentru Bush, distinge constant managementul de leadership și urmărește scopurile educaționale, influența și învățarea.',
'Hattie':'La Hattie, caută impactul asupra învățării, feedbackul și mărimea efectului. Capcana este alegerea unei practici atractive sau administrative care nu este ideea centrală a autorului.',
'Senge':'La Senge, gândește organizația care învață: viziune/idei directoare, reflecție, conversație și învățare organizațională. Nu reduce conceptele la documente sau proceduri formale.'
};
function exp(sec,q,correct){for(const k in special)if(q.toLowerCase().includes(k.toLowerCase()))return special[k];if(sec.includes('Analogii A'))return 'Caută proprietatea definitorie comună, nu una accidentală. O soluție bună trebuie să rămână adevărată în cât mai multe situații.';if(sec.includes('Analogii B'))return 'Transformă prima pereche într-o propoziție: „A se raportează la B prin...”. Aplică exact aceeași propoziție celei de-a doua perechi și păstrează direcția relației.';if(sec.includes('Raționament verbal'))return 'Folosește numai fragmentul. Adevărat = textul susține direct; Fals = textul contrazice; Nu se poate spune = lipsesc date. Nu completa enunțul cu experiența sau cunoștințele tale.';if(sec.includes('numeric'))return 'Scrie ce se cere, extrage datele, stabilește formula/operația, calculează și verifică ordinul de mărime. La procente și rapoarte, identifică explicit baza de raportare înainte de calcul.';if(sec.includes('Leadership'))return 'Caută răspunsul care rezolvă problema la nivelul potrivit: direct, constructiv, proporțional și colaborativ. Evită pasivitatea, atacul personal, amenințarea și escaladarea prematură.';if(sec.includes('Cunoștințe'))return 'Identifică autorul și conceptul exact testat. Elimină variantele plauzibile în general, dar care nu exprimă ideea din bibliografie. Răspunsul corect aici este '+correct+'.';if(sec.includes('Legislație'))return 'Pentru acest subiect istoric, lucrează cu actul normativ și forma valabilă în 2021. Caută cine are competența, verbul juridic exact și condițiile/pragurile din enunț; nu transfera automat regula la legislația actuală.';return 'Memorează regula de rezolvare, nu litera răspunsului.'}
const f=document.getElementById('test');f.addEventListener('load',()=>{const d=f.contentDocument;const b=d.getElementById('check');if(!b)return;b.addEventListener('click',()=>setTimeout(()=>{const fb=d.getElementById('fb');if(!fb||!b.disabled)return;const sec=d.getElementById('sec').textContent,q=d.getElementById('q').textContent;let correct='varianta marcată cu verde';const txt=fb.textContent;if(txt.includes('corect este'))correct=txt.split('corect este ')[1];let x=d.getElementById('learning');if(!x){x=d.createElement('div');x.id='learning';x.style.cssText='margin-top:12px;padding:15px;border-radius:12px;background:#eef4ff;border-left:4px solid #2949a6;line-height:1.6;color:#172033';fb.insertAdjacentElement('afterend',x)}x.innerHTML='<strong>🧠 Cum gândesc un item asemănător</strong><br>'+exp(sec,q,correct)+'<br><br><strong>Regula de concurs:</strong> reține metoda, nu poziția variantei corecte.';},30));const n=d.getElementById('next');n.addEventListener('click',()=>{const x=d.getElementById('learning');if(x)x.remove()})});
</script></body></html>
