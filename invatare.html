<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>15 octombrie 2021 – mod de învățare</title><style>html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#f5f7fb}#test{width:100%;height:100vh;border:0;display:block}</style></head><body><iframe id="test" src="./index.html" title="Test 15 octombrie 2021"></iframe><script>
const specific={
'10.000 și 19.999':'Aduni cele două intervale relevante pentru magazinele urbane: 4.260 + 4.874 = 9.134. Regula: când cerința acoperă mai multe intervale, identifică exact rândurile și însumează numai valorile cerute.',
'raportul aproximativ dintre magazinele rurale':'Raportul cerut este rural/urban: 5.290 ÷ 17.406 ≈ 0,30. Capcana este inversarea raportului. Scrie întotdeauna în ordinea din enunț: primul termen împărțit la al doilea.',
'valoarea totală a vânzărilor obținută în magazinele rurale':'Sunt 58 de magazine, cu o medie de 4.300 RON: 58 × 4.300 = 249.400 RON. Regula: total = număr de unități × valoare medie.',
'Florina a primit în total în prima săptămână':'Florina: 13.860 ÷ 630 = 22 RON/km. Silviu primește cu 5 RON mai puțin, deci 17 RON/km. 490 × 17 = 8.330 RON. Descompune problema în pași și nu aplica diferența de 5 direct sumei totale.',
'consumă cu 25% mai puțin':'Compară pentru fiecare săptămână consumul comun proporțional cu distanțele, ținând cont că Silviu are consumul redus cu 25%. Regula: transformă procentul într-un coeficient (75%) și compară aceleași mărimi.',
'un litru de combustibil la 11 km':'Silviu a parcurs 307 km în săptămâna 3. 307 ÷ 11 ≈ 27,9, adică aproximativ 28 litri. Regula: la „1 litru la X km”, consumul = distanța ÷ X.',
'Levin':'Ideea urmărită este folosirea rezultatelor și a feedbackului elevilor și personalului pentru îmbunătățirea învățării. La itemii de autor, nu alege varianta care doar „sună managerial”; caută formularea care exprimă conceptul central din bibliografie.',
'instrument de dezvoltare profesională':'În logica lui Hattie, eficiența trebuie legată de impact, exprimat prin mărimea efectului. Reține: la Hattie întrebarea decisivă este ce efect are intervenția asupra învățării, nu cât de atractivă sau interactivă pare.',
'motivul principal pentru care profesorii decid să rămână':'Răspunsul oficial indică sprijinul primit de la liderii școlari. Pentru itemi similari, caută factorul organizațional asupra căruia leadershipul poate interveni direct.',
'centrul managementului educațional':'La Bush, managementul educațional este strâns legat de stabilirea scopurilor și obiectivelor organizației. Procedurile și rapoartele sunt mijloace; obiectivele dau direcția.',
'Conceptul de bază al ideii de leadership':'Bush distinge leadershipul de simpla autoritate formală: nucleul este influența. Capcana este asocierea automată a leadershipului cu funcția sau poziția ierarhică.',
'Liderii de succes':'În organizațiile educaționale, scopul central este învățarea; de aceea leadershipul de succes rămâne focalizat pe învățare. Întreabă-te mereu care este finalitatea fundamentală a școlii.',
'ideile directoare” reprezintă':'La Senge, ideile directoare exprimă identitatea organizației și scopul ei fundamental. Nu le reduce la un document formal sau la o listă de activități.',
'„ideile directoare” rezultă':'Ele se formează prin reflecții și conversații îndelungate. Regula de transfer: cultura și sensul comun al organizației se construiesc participativ, nu doar prin regulamente.',
'leadership-ul educațional este o practică':'În cheia oficială, sunt reunite dimensiunile intelectuală, morală și de expertiză; de aceea răspunsul este „toate variantele”. La itemii cumulativi verifică fiecare afirmație înainte de a selecta varianta globală.',
'fuziune prin absorbție':'Pentru acest subiect istoric, răspunsul se raportează la Legea nr. 1/2011 în forma utilizată în 2021. Metoda: identifică exact statutul juridic al unităților și nu transfera automat regula la legislația actuală.',
'structura sistemului național':'Răspunsul oficial este învățământul secundar inferior = clasele V–VIII. La astfel de itemi construiește mental schema nivelurilor de învățământ și elimină variantele care mută clasele într-un nivel greșit.',
'Asistența psihoeducațională':'Competența indicată în subiect aparține CJRAE/CMBRAE. Regula: la întrebările instituționale, leagă atribuția de instituția specializată, nu de una cu rol general de formare sau administrare.',
'contestației la o lucrare scrisă':'Cheia oficială indică directorul unității pentru consemnarea notei rezultate în urma contestației, potrivit cadrului folosit în 2021. Reține separat procedura de evaluare de procedura de consemnare.',
'criteriile specifice de acordare':'În subiectul din 2021, criteriile specifice sunt stabilite anual de consiliul de administrație al unității. La legislație, observă verbul exact: „stabilește”, „aprobă”, „propune” pot aparține unor structuri diferite.',
'finalitățile învățământului obligatoriu':'Răspunsul oficial este nivelul funcțional. La curriculum, învață termenii exact în forma din cadrul de referință; variantele apropiate semantic sunt capcane frecvente.',
'Competențele sunt definite':'Formula urmărită este cunoștințe + abilități + atitudini. Reține triada ca structură fixă; variantele înlocuiesc deliberat un element cu „aptitudini” sau „valori”.',
'NU reprezintă una dintre cele trei categorii':'„Competențe operaționale” este intrusul. La itemii cu NU, marchează mental negația înainte de a analiza variantele; multe erori vin din răspunsul la întrebarea inversă.',
'directorul NU are atribuții':'Aprobarea formațiunilor sub minim/peste maxim în situații excepționale nu era atribuția directorului în cadrul normativ testat. Metoda: separă atribuțiile directorului de competențele CA/inspectoratului/ministerului.',
'obligatorie realizarea unui audit':'În cheia oficială, auditul este legat de propunerea consiliului profesoral cu votul a 2/3. La astfel de itemi urmărește simultan organul, pragul de vot și procedura declanșată.',
'document de prognoză':'Programul de dezvoltare a sistemului de control managerial este încadrat ca document de prognoză în cadrul normativ testat. Capcana: rapoartele sunt, prin natura lor, documente de evaluare/diagnoză, nu de prognoză.'
};
function explain(sec,q,correct){for(const k in specific)if(q.includes(k))return specific[k];if(sec.includes('Analogii A'))return 'Caută asemănarea esențială și comună celor două noțiuni, nu o trăsătură accidentală. Întreabă-te: „din ce categorie funcțională fac ambele parte?” Această regulă se transferă direct la orice item de asemănări.';if(sec.includes('Analogii B'))return 'Identifică relația exactă din prima pereche, apoi aplică aceeași relație celei de-a doua. Nu căuta doar cuvinte asociate; relația trebuie să fie de același tip și în aceeași direcție.';if(sec.includes('Raționament verbal'))return 'Răspunde exclusiv din text, nu din cunoștințele tale. „Adevărat” cere susținere directă, „Fals” cere contradicție directă, iar „Nu se poate spune” se alege când informația nu este suficientă. Capcana frecventă este să completezi textul cu presupuneri plauzibile.';if(sec.includes('numeric'))return 'Metoda pentru itemii numerici: 1) notează ce se cere; 2) extrage numai datele necesare; 3) stabilește operația înainte de calcul; 4) estimează ordinul de mărime; 5) verifică unitatea și sensul rezultatului. Răspunsul corect aici este '+correct+'.';if(sec.includes('Leadership'))return 'La itemii situaționali caută intervenția directă, constructivă și proporțională cu problema. Evită pasivitatea, escaladarea prematură, umilirea și reacțiile punitive. Întâi clarifici problema și acționezi asupra cauzei, păstrând colaborarea.';return 'Reține nu doar varianta, ci regula din spatele ei. Identifică noțiunea-cheie din întrebare, elimină variantele care sunt doar plauzibile și verifică formularea exactă cerută de sursa bibliografică.'}
const f=document.getElementById('test');f.addEventListener('load',()=>{const d=f.contentDocument,w=f.contentWindow;const b=d.getElementById('check');if(!b)return;b.addEventListener('click',()=>setTimeout(()=>{const fb=d.getElementById('feedback');if(!fb||!b.disabled)return;const sec=d.getElementById('section').textContent,q=d.getElementById('question').textContent;const correct=fb.textContent.includes('Răspunsul corect')?fb.textContent.split('Răspunsul corect este ')[1]:'varianta marcată cu verde';let x=d.getElementById('learning');if(!x){x=d.createElement('div');x.id='learning';x.style.cssText='margin-top:12px;padding:15px;border-radius:12px;background:#eef4ff;border-left:4px solid #2949a6;line-height:1.6;color:#172033';fb.insertAdjacentElement('afterend',x)}x.innerHTML='<strong>🧠 Cum gândesc un item asemănător</strong><br>'+explain(sec,q,correct)+'<br><br><strong>De reținut:</strong> nu memora litera răspunsului; memorează regula de rezolvare.';},20));const next=d.getElementById('next');next.addEventListener('click',()=>{const x=d.getElementById('learning');if(x)x.remove()})});
</script></body></html>
